name: deploy
'on':
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: temurin
    - name: Build JAR with Maven
      run: mvn -B package -DskipTests --no-transfer-progress
    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
        retention-days: 1
  provision:
    runs-on: ubuntu-latest
    needs:
    - build
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: nyc3
      TF_VAR_droplet_size: s-1vcpu-1gb
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    timeout-minutes: 20
    outputs:
      droplet_ip: ${{ steps.get_ip.outputs.droplet_ip }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Derive Spaces region and init Terraform
      run: "host=\"${AWS_ENDPOINT_URL_S3#https://}\"\nSPACES_REGION=\"${host%%.*}\"\
        \nterraform -chdir=infra init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${SPACES_REGION}\"\
        \ \\\n  -backend-config=\"skip_credentials_validation=true\" \\\n  -backend-config=\"\
        skip_requesting_account_id=true\" \\\n  -backend-config=\"skip_metadata_api_check=true\"\
        \ \\\n  -backend-config=\"skip_region_validation=true\" \\\n  -backend-config=\"\
        skip_s3_checksum=true\" \\\n  -backend-config=\"use_path_style=true\"\n"
    - name: Terraform Apply
      run: terraform -chdir=infra apply -input=false -auto-approve
    - id: get_ip
      name: Get Droplet IP
      run: 'ip=$(terraform -chdir=infra output -raw droplet_ip)

        echo "droplet_ip=${ip}" >> "$GITHUB_OUTPUT"

        '
  configure:
    runs-on: ubuntu-latest
    needs:
    - provision
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Download JAR artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/
    - name: Install Ansible
      run: pip install ansible-core
    - name: Write SSH private key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
    - name: Scan host key
      run: 'HOST="${{ needs.provision.outputs.droplet_ip }}"

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
    - name: Generate inventory
      run: "HOST=\"${{ needs.provision.outputs.droplet_ip }}\"\nprintf '[app]\\n%s\
        \ ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\\n' \\\n\
        \  \"$HOST\" \"${{ secrets.SSH_USER }}\" > inventory.ini\n"
    - name: Resolve JAR path and run Ansible playbook
      run: "JAR_PATH=$(ls \"$GITHUB_WORKSPACE/target\"/*.jar | head -n1)\nansible-playbook\
        \ -i inventory.ini ansible/site.yml \\\n  --extra-vars \"jar_path=${JAR_PATH}\"\
        \n"
      env:
        ANSIBLE_HOST_KEY_CHECKING: 'False'
  verify:
    runs-on: ubuntu-latest
    needs:
    - provision
    - configure
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Re-init Terraform to read outputs
      run: "host=\"${AWS_ENDPOINT_URL_S3#https://}\"\nSPACES_REGION=\"${host%%.*}\"\
        \nterraform -chdir=infra init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=${SPACES_REGION}\"\
        \ \\\n  -backend-config=\"skip_credentials_validation=true\" \\\n  -backend-config=\"\
        skip_requesting_account_id=true\" \\\n  -backend-config=\"skip_metadata_api_check=true\"\
        \ \\\n  -backend-config=\"skip_region_validation=true\" \\\n  -backend-config=\"\
        skip_s3_checksum=true\" \\\n  -backend-config=\"use_path_style=true\"\n"
    - name: Health check app
      run: "HOST=$(terraform -chdir=infra output -raw droplet_ip)\necho \"Checking\
        \ http://$HOST/\"\ncurl --fail --retry 15 --retry-delay 15 --retry-all-errors\
        \ \\\n  -o /dev/null -s -w \"%{http_code}\" \"http://$HOST/\"\n"
