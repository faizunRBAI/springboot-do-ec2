---
- name: Configure Spring Boot app on DigitalOcean Droplet
  hosts: app
  become: true
  gather_facts: true

  vars:
    app_name: springboot-do-ec2
    app_port: 8080
    app_user: springboot
    app_dir: /opt/springboot

  tasks:
    # ── Wait for SSH ────────────────────────────────────────────────────────
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

    # ── System packages ──────────────────────────────────────────────────────
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      register: apt_update
      retries: 5
      delay: 10
      until: apt_update is succeeded

    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - openjdk-17-jre-headless
          - nginx
          - curl
        state: present

    # ── App user & directory ─────────────────────────────────────────────────
    - name: Create app user
      ansible.builtin.user:
        name: "{{ app_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ app_dir }}"
        create_home: true

    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0750"

    # ── Copy JAR ─────────────────────────────────────────────────────────────
    # The configure stage downloads the JAR to target/ in the repo root.
    # We pass the absolute path via extra-vars (jar_path) from the CI step.
    - name: Copy JAR to droplet
      ansible.builtin.copy:
        src: "{{ jar_path }}"
        dest: "{{ app_dir }}/app.jar"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0640"
      notify: Restart springboot

    # ── Systemd service ──────────────────────────────────────────────────────
    - name: Write systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/springboot.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Spring Boot Application
          After=network.target

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -jar {{ app_dir }}/app.jar --server.port={{ app_port }}
          SuccessExitStatus=143
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=springboot

          [Install]
          WantedBy=multi-user.target
      notify: Restart springboot

    - name: Enable and start Spring Boot service
      ansible.builtin.systemd:
        name: springboot
        enabled: true
        state: started
        daemon_reload: true

    # ── Nginx reverse proxy ──────────────────────────────────────────────────
    - name: Remove default nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx

    - name: Write nginx vhost for Spring Boot
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/springboot
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              client_max_body_size 20M;

              location / {
                  proxy_pass         http://127.0.0.1:{{ app_port }};
                  proxy_http_version 1.1;
                  proxy_set_header   Host              $host;
                  proxy_set_header   X-Real-IP         $remote_addr;
                  proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
                  proxy_set_header   X-Forwarded-Proto $scheme;
                  proxy_read_timeout 60s;
              }
          }
      notify: Reload nginx

    - name: Enable springboot nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/springboot
        dest: /etc/nginx/sites-enabled/springboot
        state: link
      notify: Reload nginx

    # ── Wait for app to be healthy ───────────────────────────────────────────
    - name: Flush handlers before health check
      ansible.builtin.meta: flush_handlers

    - name: Wait for Spring Boot to listen on port {{ app_port }}
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ app_port }}"
        timeout: 120
        state: started

  handlers:
    - name: Restart springboot
      ansible.builtin.systemd:
        name: springboot
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: reloaded
